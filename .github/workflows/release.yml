name: release

# On a `signer-v*` tag: build the dvtee binary twice, from two different
# checkout paths, and fail unless the bytes match. Then attest its build
# provenance (Sigstore, keyless, tied to this workflow and commit) and attach
# it to a draft GitHub release with its SHA-256.
#
# Verify a download:
#   sha256sum -c dvtee-x86_64-unknown-linux-gnu.sha256
#   gh attestation verify dvtee-x86_64-unknown-linux-gnu --repo ObolNetwork/dvtee
# or rebuild it: check out the tag, install the toolchain in BUILD-TOOLCHAIN,
# run signer/scripts/build-release.sh and compare the hash.

on:
  push:
    tags: ["signer-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.100.0"

jobs:
  build:
    name: build (${{ matrix.path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        path: [a, longer-checkout-path]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.path }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build
        working-directory: ${{ matrix.path }}/signer
        run: scripts/build-release.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.path }}
          path: ${{ runner.temp }}/dist

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dists
      - name: Builds must be identical
        run: |
          cmp dists/dist-a/dvtee-x86_64-unknown-linux-gnu \
              dists/dist-longer-checkout-path/dvtee-x86_64-unknown-linux-gnu
          cat dists/dist-a/dvtee-x86_64-unknown-linux-gnu.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dists/dist-a/dvtee-x86_64-unknown-linux-gnu
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes "Reproducible build; see .github/workflows/release.yml to verify." \
            dists/dist-a/dvtee-x86_64-unknown-linux-gnu \
            dists/dist-a/dvtee-x86_64-unknown-linux-gnu.sha256 \
            dists/dist-a/BUILD-TOOLCHAIN
