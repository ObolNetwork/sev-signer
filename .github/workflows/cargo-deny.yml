name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "signer/Cargo.toml"
      - "signer/Cargo.lock"
      - "signer/deny.toml"
      - ".github/workflows/cargo-deny.yml"
  schedule:
    # Daily advisory scan so new RustSec advisories surface without a PR.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PRs and pushes: advisories, bans, licenses and sources.
      - name: cargo deny check
        if: github.event_name != 'schedule'
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: ./signer/Cargo.toml
          arguments: --all-features --locked
          command: check

      # Scheduled: advisories only (the rest can't change without a commit).
      - name: cargo deny check advisories
        if: github.event_name == 'schedule'
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: ./signer/Cargo.toml
          arguments: --all-features --locked
          command: check
          command-arguments: advisories
