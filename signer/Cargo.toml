[package]
name = "sev-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Web3Signer-compatible eth2 BLS signer for confidential VMs"
license = "BUSL-1.1"
publish = false

[dependencies]
aes = "0.9"
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
blst = "0.3.17"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctr = "0.10"
hex = "0.4.3"
hmac = "0.13"
pbkdf2 = "0.13"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scrypt = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[features]
# Software stand-in for the TEE (no security) for development and e2e tests
# on machines without SEV-SNP. Never enabled in release images.
insecure-dev = []

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = "0.5.3"

# Keystore KDFs and BLS are painfully slow unoptimized; keep tests fast.
[profile.dev.package]
scrypt = { opt-level = 3 }
pbkdf2 = { opt-level = 3 }
sha2 = { opt-level = 3 }
blst = { opt-level = 3 }
salsa20 = { opt-level = 3 }

[profile.release]
lto = true
codegen-units = 1
