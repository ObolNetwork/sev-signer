[package]
name = "dvtee"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Web3Signer-compatible eth2 BLS signer for confidential VMs"
license = "BUSL-1.1"
publish = false

[dependencies]
# Crypto and key-handling crates are pinned to exact versions; bump them
# deliberately, one at a time, with the spec and vector tests.
aes = "=0.8.4"
anyhow = "1.0.104"
base64 = "0.23.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
blst = "=0.3.17"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctr = "=0.9.2"
hex = "0.4.3"
hmac = "=0.12.1"
pbkdf2 = "=0.12.2"
# Report and AMD chain signatures (RSA-PSS, ECDSA P-384); already used by rustls.
ring = "=0.17.14"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# System CA roots for `verify-evidence --fetch-vcek` (AMD KDS over HTTPS).
rustls-native-certs = "=0.8.5"
scrypt = "=0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower-http = { version = "0.7.1", features = ["add-extension", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "=0.1.26"
# Parsing the AMD certificates (ARK, ASK, VCEK) for verify-evidence.
x509-cert = { version = "=0.3.1", default-features = false }
zeroize = "=1.9.1"

# Load test client (`--features load-test`). Already in the lock file through
# axum and axum-server, except hyper's client-side `want` and `try-lock`.
# Not linked into the signer binary.
http-body-util = { version = "=0.1.5", optional = true }
hyper = { version = "=1.12.0", optional = true, features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", optional = true, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[features]
# Software stand-in for the TEE (no security) for development and e2e tests
# on machines without SEV-SNP. Never enabled in release images.
insecure-dev = []
# The `dvtee-load` load test tool (docs/load-test.md).
load-test = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/net",
    "tokio/time",
]

[[bin]]
name = "dvtee-load"
path = "src/bin/dvtee-load/main.rs"
required-features = ["load-test"]

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = "0.5.3"

# Keystore KDFs and BLS are painfully slow unoptimized; keep tests fast.
[profile.dev.package]
scrypt = { opt-level = 3 }
pbkdf2 = { opt-level = 3 }
sha2 = { opt-level = 3 }
blst = { opt-level = 3 }
salsa20 = { opt-level = 3 }

[profile.release]
lto = true
codegen-units = 1
