<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>dvtee architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2FE4AB"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CC2C9"/>
    </marker>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2A26"/>
      <stop offset="1" stop-color="#0B1D1B"/>
    </linearGradient>
  </defs>

  <rect width="960" height="500" rx="16" fill="#091011"/>

  <!-- Untrusted host -->
  <rect x="32" y="56" width="380" height="300" rx="12" fill="none" stroke="#3A5257" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="52" y="86" fill="#9CC2C9" font-size="13" font-weight="600" letter-spacing="1.5">OPERATOR HOST · UNTRUSTED</text>

  <rect x="64" y="108" width="316" height="58" rx="8" fill="#16262A" stroke="#3A5257"/>
  <text x="84" y="133" fill="#E1E9EB" font-size="16" font-weight="600">Beacon node</text>
  <text x="84" y="154" fill="#9CC2C9" font-size="13">consensus + execution clients</text>

  <rect x="64" y="186" width="316" height="58" rx="8" fill="#16262A" stroke="#3A5257"/>
  <text x="84" y="211" fill="#E1E9EB" font-size="16" font-weight="600">Charon</text>
  <text x="84" y="232" fill="#9CC2C9" font-size="13">distributed validator consensus</text>

  <rect x="64" y="264" width="316" height="58" rx="8" fill="#16262A" stroke="#3A5257"/>
  <text x="84" y="289" fill="#E1E9EB" font-size="16" font-weight="600">Validator client</text>
  <text x="84" y="310" fill="#9CC2C9" font-size="13">Lighthouse, Teku, Lodestar, …</text>

  <line x1="222" y1="166" x2="222" y2="186" stroke="#9CC2C9" stroke-width="1.5" marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)"/>
  <line x1="222" y1="244" x2="222" y2="264" stroke="#9CC2C9" stroke-width="1.5" marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)"/>

  <!-- Confidential VM -->
  <rect x="548" y="40" width="380" height="332" rx="12" fill="url(#tee)" stroke="#2FE4AB" stroke-width="2"/>
  <text x="568" y="70" fill="#2FE4AB" font-size="13" font-weight="600" letter-spacing="1.5">CONFIDENTIAL VM · SEV-SNP</text>
  <text x="568" y="90" fill="#9CC2C9" font-size="12">memory encrypted · boot measured</text>

  <rect x="572" y="108" width="332" height="96" rx="8" fill="#13332D" stroke="#2FE4AB"/>
  <text x="592" y="136" fill="#FFFFFF" font-size="18" font-weight="700">dvtee</text>
  <text x="592" y="158" fill="#BFF5E3" font-size="13">recomputes every signing root</text>
  <text x="592" y="177" fill="#BFF5E3" font-size="13">EIP-3076 slashing protection</text>
  <text x="592" y="196" fill="#BFF5E3" font-size="13">TLS terminates inside the guest</text>

  <rect x="572" y="222" width="332" height="126" rx="8" fill="#0E2420" stroke="#2C5A50"/>
  <text x="592" y="248" fill="#E1E9EB" font-size="14" font-weight="600">Encrypted data disk</text>
  <text x="592" y="270" fill="#9CC2C9" font-size="13">sealed to the launch measurement</text>
  <g font-size="13" fill="#E1E9EB">
    <rect x="592" y="284" width="96" height="44" rx="6" fill="#16262A" stroke="#3A5257"/>
    <text x="640" y="304" text-anchor="middle">BLS key</text>
    <text x="640" y="320" text-anchor="middle">shares</text>
    <rect x="696" y="284" width="96" height="44" rx="6" fill="#16262A" stroke="#3A5257"/>
    <text x="744" y="304" text-anchor="middle">slashing</text>
    <text x="744" y="320" text-anchor="middle">watermarks</text>
    <rect x="800" y="284" width="88" height="44" rx="6" fill="#16262A" stroke="#3A5257"/>
    <text x="844" y="304" text-anchor="middle">TLS</text>
    <text x="844" y="320" text-anchor="middle">key</text>
  </g>

  <!-- VC to signer -->
  <path d="M380,293 C470,293 470,156 572,156" fill="none" stroke="#2FE4AB" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="416" y="206" width="128" height="44" rx="6" fill="#091011"/>
  <text x="480" y="224" fill="#2FE4AB" font-size="13" font-weight="600" text-anchor="middle">Web3Signer API</text>
  <text x="480" y="242" fill="#9CC2C9" font-size="12" text-anchor="middle">over mTLS</text>

  <!-- Attestation -->
  <rect x="32" y="400" width="380" height="68" rx="8" fill="#16262A" stroke="#3A5257"/>
  <text x="52" y="428" fill="#E1E9EB" font-size="16" font-weight="600">Operator / verifier</text>
  <text x="52" y="450" fill="#9CC2C9" font-size="13">checks measurement, policy, key binding</text>

  <rect x="548" y="400" width="380" height="68" rx="8" fill="#16262A" stroke="#3A5257"/>
  <text x="568" y="428" fill="#E1E9EB" font-size="16" font-weight="600">AMD Secure Processor</text>
  <text x="568" y="450" fill="#9CC2C9" font-size="13">hardware root of trust, signs reports</text>

  <line x1="738" y1="372" x2="738" y2="400" stroke="#9CC2C9" stroke-width="1.5" marker-start="url(#arrow-muted)"/>
  <line x1="548" y1="434" x2="412" y2="434" stroke="#2FE4AB" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="480" y="424" fill="#2FE4AB" font-size="12" font-weight="600" text-anchor="middle">attestation</text>
  <text x="480" y="456" fill="#9CC2C9" font-size="11" text-anchor="middle">nonce · TLS cert · keys</text>
</svg>
