# dvtee guest image for AMD SEV-SNP (see README.md).
#
# Output: a UKI (kernel, initrd and command line in one PE file) that our
# OVMF boots directly with kernel-hashes=on, so all three are in the launch
# measurement, plus a disk image with an erofs root under dm-verity. The
# verity root hash is on the UKI's command line.
#
# Reproducibility: every package comes from one snapshot.debian.org
# timestamp, the tools tree (systemd-repart, mkfs.erofs, ukify) from the same
# snapshot, timestamps are clamped to SourceDateEpoch, and Seed fixes the
# partition UUIDs and verity salt. Moving the snapshot means a new
# measurement.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Snapshot=20261120T000000Z

[Output]
Format=disk
ImageId=dvtee
Output=dvtee
CompressOutput=no
ManifestFormat=json
SplitArtifacts=uki,roothash
Seed=eb50dd2f-56fd-4af9-970d-217245aae1f3

[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# Only the base tools (apt, systemd-repart, ukify, mkfs.erofs): fewer packages
# to resolve against the snapshot.
ToolsTreeProfiles=
WithNetwork=no

[Validation]
Verity=hash

[Content]
SourceDateEpoch=1795132800
Bootable=yes
Bootloader=uki
UnifiedKernelImages=unsigned
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
Locale=C.UTF-8
Hostname=dvtee
ExtraTrees=%D/payload

# dmsetup: its 55-dm.rules sets DM_NAME on the dm devices the initrd opened (the
# verity root and the sealed data disk). Without it, 99-systemd.rules marks them
# SYSTEMD_READY=0 after switch-root, and systemd unmounts the data disk.
Packages=
        linux-image-6.12.117+deb13-cloud-amd64
        systemd
        systemd-resolved
        systemd-sysv
        systemd-boot-efi
        udev
        dmsetup
        kmod
        e2fsprogs
        tar

# Modules for the initrd: mkosi's defaults (dm-verity, dm-crypt, erofs,
# virtio, ...) plus the SNP guest driver, configfs-tsm and the AEAD cipher.
KernelInitrdModules=
        default
        /drivers/virt/coco/
        dm-integrity
        aegis128
        aegis128-aesni

# The UKI's command line. mkosi appends roothash=. Everything here is
# measured, so the host cannot change it without changing MEASUREMENT.
#   systemd.volatile=state      read-only root, /var on tmpfs
#   gpt_auto=0                  never activate partitions the host adds
#   getty_auto=0, mask debug-shell   no login path (getty units are also masked)
#   forward_to_console          logs go out on the serial console, initrd included
#   lockdown, sig_enforce       no unsigned modules, no /dev/mem, no kexec
KernelCommandLine=
        console=ttyS0,115200
        ro
        rootfstype=erofs
        systemd.volatile=state
        systemd.gpt_auto=0
        rd.systemd.gpt_auto=0
        systemd.getty_auto=0
        systemd.mask=debug-shell.service
        rd.systemd.mask=debug-shell.service
        systemd.firstboot=0
        systemd.journald.forward_to_console=1
        lockdown=confidentiality
        module.sig_enforce=1

RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/locale
