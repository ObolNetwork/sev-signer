# No core dumps (they would contain keys), and less kernel information for local processes.
kernel.core_pattern=|/bin/false
fs.suid_dumpable=0
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.yama.ptrace_scope=3
kernel.kexec_load_disabled=1
kernel.unprivileged_bpf_disabled=1
# The serial console is host input: no magic SysRq.
kernel.sysrq=0
