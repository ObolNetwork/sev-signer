# resolved starts early (DefaultDependencies=no) and sets up a private /var/tmp.
# With systemd.volatile=state the read-only root has an empty /var until the
# /var tmpfs is mounted, so without this ordering resolved fails with
# "/var/tmp: No such file or directory" (226/NAMESPACE) and the guest has no DNS
# for the Roughtime servers.
[Unit]
RequiresMountsFor=/var/tmp
